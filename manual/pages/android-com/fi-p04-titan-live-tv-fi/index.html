<script>
/* TV remote (Titan OS) arrow-key scrolling for manual pages.
   Self-disables on pages that have any other focusable element,
   so chapter lists keep their original focus navigation.
   Old-style JS on purpose - must run on older TV engines. */
(function () {
  var FOCUSABLE = 'a[href], button, input, select, textarea, [tabindex]';
  var FALLBACK_HREF = "https:\/\/data.umc-poland.com\/android-com\/fi-p04-titan-live-tv-fi\/?lang=fi";

  function getBack() { return document.getElementById('backlink'); }

  function hasOtherFocusable() {
    var back = getBack();
    var els = document.querySelectorAll(FOCUSABLE);
    for (var i = 0; i < els.length; i++) {
      if (els[i] !== back && els[i].getAttribute('tabindex') !== '-1') { return true; }
    }
    return false;
  }

  function init() {
    var back = getBack();
    if (!back) { return; }
    if (!back.getAttribute('href')) {
      var url = null;
      try { url = localStorage.getItem('url'); } catch (e) {}
      back.setAttribute('href', url || FALLBACK_HREF);
    }
    if (!hasOtherFocusable()) { back.focus(); }
  }

  /* On load, not ready: the jQuery block that rewrites .con-center
     (and recreates #backlink) runs on ready, before this. */
  if (document.readyState === 'complete') { setTimeout(init, 0); }
  else { window.addEventListener('load', function () { setTimeout(init, 0); }); }

  /* Scroll step. Adjust here if 70% feels too coarse on desktop. */
  /* Floor guards against a 0/:tiny viewport reporting innerHeight 0,
     which would preventDefault the key but scroll nothing. */
  function step() { return Math.max(100, Math.round(window.innerHeight * 0.7)); }

  window.addEventListener('keydown', function (e) {
    var k = e.keyCode || e.which;
    var name = e.key || '';
    var isDown = k === 40 || name === 'ArrowDown' || name === 'Down';
    var isUp   = k === 38 || name === 'ArrowUp'   || name === 'Up';
    if (!isDown && !isUp) { return; }
    if (hasOtherFocusable()) { return; }

    e.preventDefault();
    e.stopPropagation();

    var back = getBack();
    var top = window.pageYOffset || document.documentElement.scrollTop;
    if (isDown) {
      if (back && document.activeElement === back) { back.blur(); }
      window.scrollBy(0, step());
    } else if (top <= 0) {
      if (back) { back.focus(); }
    } else {
      window.scrollBy(0, -step());
    }
  }, true);
})();
</script>
