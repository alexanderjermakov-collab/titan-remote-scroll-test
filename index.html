<!doctype html>
<html lang="en" data-language-selector="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sharp Life Portal language selection</title>
  <style>
    :root { color-scheme: dark; font-family: "Source Sans Pro", Arial, sans-serif; background: #050505; color: #fff; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 0%, rgba(130, 0, 0, 0.34), transparent 42%), linear-gradient(180deg, #151515 0%, #050505 70%);
    }
    main {
      width: min(920px, calc(100% - 64px)); padding: 54px 64px 58px;
      background: rgba(20, 20, 20, 0.96); border: 1px solid #414141;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
    }
    .brand { width: 210px; height: auto; display: block; margin-bottom: 42px; filter: brightness(0) invert(1); }
    h1 { margin: 0 0 14px; font-size: clamp(34px, 5vw, 60px); line-height: 1.05; letter-spacing: -0.025em; }
    .intro { margin: 0 0 38px; max-width: 720px; color: #d3d3d3; font-size: clamp(20px, 2.3vw, 28px); line-height: 1.35; }
    label { display: block; margin-bottom: 12px; font-size: 21px; font-weight: 700; }
    .controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: stretch; }
    select, button { min-height: 72px; border-radius: 0; font: inherit; font-size: 24px; }
    select { width: 100%; padding: 0 58px 0 22px; border: 3px solid #777; background: #fff; color: #111; }
    button { min-width: 220px; padding: 0 34px; border: 3px solid #d71920; background: #d71920; color: #fff; font-weight: 700; cursor: pointer; }
    select:focus, button:focus { outline: 5px solid #fff; outline-offset: 4px; }
    .url-preview { margin: 26px 0 0; color: #bcbcbc; font-size: 17px; overflow-wrap: anywhere; }
    .url-preview code { color: #fff; }
    .hint { margin: 30px 0 0; color: #aaa; font-size: 17px; }
    @media (max-width: 700px) {
      main { width: 100%; min-height: 100vh; padding: 36px 28px; border: 0; }
      .controls { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
  <script src="https://sdk.titanos.tv/sdk/sdk.js" type="text/javascript"></script>
  <script src="./portal-navigation.js?v=8.0.7" type="text/javascript" defer></script>
  <script src="./titan-language-control.js?v=8.0.7" type="text/javascript" defer></script>
  <script src="./language-selector-i18n.js" type="text/javascript" defer></script>
  <script src="./portal-accessibility.js" type="text/javascript" defer></script>
</head>
<body>
  <main aria-labelledby="page-title">
    <img class="brand" src="./assets/sharp_logo.svg" alt="Sharp">
    <h1 id="page-title">Select portal language</h1>
    <p class="intro" id="page-intro">Choose the language for Sharp Life Portal. The selected ISO language code will be added to the URL.</p>
    <form action="./" method="get" id="language-form">
      <label for="language" id="language-label">Portal UI language</label>
      <div class="controls">
        <select id="language" name="lang" aria-label="Portal UI language. English" autofocus>
          <option value="bg">Български</option><option value="ca">Català</option>
          <option value="cs">Čeština</option><option value="da">Dansk</option>
          <option value="de">Deutsch</option><option value="el">Ελληνικά</option>
          <option value="en" selected>English</option><option value="es">Español</option>
          <option value="et">Eesti</option><option value="fi">Suomi</option>
          <option value="fr">Français</option><option value="hr">Hrvatski</option>
          <option value="hu">Magyar</option><option value="it">Italiano</option>
          <option value="lt">Lietuvių</option><option value="lv">Latviešu</option>
          <option value="nl">Nederlands</option><option value="no">Norsk</option>
          <option value="pl">Polski</option><option value="pt">Português</option>
          <option value="pt-pt">Português Portugal</option><option value="ro">Română</option>
          <option value="ru">Русский</option><option value="sk">Slovenčina</option>
          <option value="sl">Slovenščina</option><option value="sr">Srpski</option>
          <option value="sv">Svenska</option><option value="uk">Українська</option>
        </select>
        <button type="submit" id="open-portal">Open portal</button>
      </div>
      <p class="url-preview"><span id="url-label">Portal URL:</span> <code id="url-preview"></code></p>
    </form>
    <p class="hint" id="navigation-hint">Use the arrow keys to choose a language and press OK to open the portal.</p>
  </main>
  <script>
    (function () {
      "use strict";
      var select = document.getElementById("language");
      var preview = document.getElementById("url-preview");
      var explicit = new URLSearchParams(window.location.search).get("lang");
      function hasOption(value) {
        for (var i = 0; i < select.options.length; i += 1) if (select.options[i].value === value) return true;
        return false;
      }
      function updatePreview() {
        var url = new URL(window.location.href);
        url.search = ""; url.hash = ""; url.searchParams.set("lang", select.value);
        preview.textContent = url.toString();
        select.setAttribute("aria-label", "Portal UI language. " + select.options[select.selectedIndex].text);
      }
      if (explicit && hasOption(explicit.toLowerCase())) select.value = explicit.toLowerCase();
      select.addEventListener("change", updatePreview);
      window.addEventListener("sharp-life-portal:device-ready", function (event) {
        if (!explicit && event.detail && hasOption(event.detail.language)) {
          select.value = event.detail.language; updatePreview();
        }
      });
      updatePreview();
    })();
  </script>
</body>
</html>
